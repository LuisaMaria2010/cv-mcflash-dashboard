<svg xmlns="http://www.w3.org/2000/svg" width="960" height="900" viewBox="0 0 960 900" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="960" height="900" fill="#e2e8f0"/>
  <text x="30" y="40" font-size="22" font-weight="600" fill="#0f172a">Modello CV MCFlash (Candidate Profile)</text>
  <text x="30" y="64" font-size="14" fill="#475569">Struttura ricavata da un CV MC reale; in arancione i segnaposto che il backend compila.</text>

  <!-- page -->
  <rect x="30" y="86" width="560" height="790" fill="#ffffff" stroke="#94a3b8"/>
  <!-- header -->
  <rect x="60" y="110" width="40" height="34" fill="#b91c1c"/><text x="66" y="134" font-size="17" font-weight="700" fill="#fff">MC</text>
  <text x="106" y="136" font-size="22" font-weight="700" fill="#1e3a8a">ENGINEERING</text>
  <circle cx="530" cy="130" r="30" fill="none" stroke="#ca8a04" stroke-width="1.5"/>
  <text x="222" y="186" font-size="17" font-weight="600" fill="#1e3a8a" text-decoration="underline">CANDIDATE PROFILE</text>

  <!-- section helper style -->
  <g font-size="11.5">
    <rect x="60" y="204" width="500" height="18" fill="#d4d4d4"/><text x="66" y="217" fill="#1e3a8a" font-weight="600">INFORMATION</text>
    <text x="190" y="242" text-anchor="end" font-style="italic" fill="#334155">Nome</text>
    <rect x="200" y="230" width="150" height="17" rx="3" fill="#ffedd5"/><text x="205" y="243" fill="#c2410c" font-weight="700">{{ codice }}</text>
    <text x="190" y="262" text-anchor="end" font-style="italic" fill="#334155">Data di Nascita</text>
    <rect x="200" y="250" width="150" height="17" rx="3" fill="#ffedd5"/><text x="205" y="263" fill="#c2410c">{{ data_nascita }}</text>
    <text x="190" y="282" text-anchor="end" font-style="italic" fill="#334155">Città</text>
    <rect x="200" y="270" width="150" height="17" rx="3" fill="#ffedd5"/><text x="205" y="283" fill="#c2410c">{{ citta }}</text>
    <text x="190" y="302" text-anchor="end" font-style="italic" fill="#334155">Ruolo</text>
    <rect x="200" y="290" width="150" height="17" rx="3" fill="#ffedd5"/><text x="205" y="303" fill="#c2410c" font-weight="700">{{ ruolo }}</text>

    <rect x="60" y="322" width="500" height="18" fill="#d4d4d4"/><text x="66" y="335" fill="#1e3a8a" font-weight="600">EDUCATION</text>
    <rect x="64" y="346" width="492" height="44" rx="4" fill="none" stroke="#f97316" stroke-dasharray="4 3"/>
    <text x="190" y="362" text-anchor="end" font-style="italic" fill="#c2410c">{{ e.anno }}</text>
    <text x="200" y="362" fill="#c2410c" font-weight="700">{{ e.titolo }}</text>
    <text x="200" y="380" fill="#c2410c">{{ e.istituto }}</text>
    <text x="470" y="384" font-size="10" fill="#9a3412">ripetuto</text>

    <rect x="60" y="402" width="500" height="18" fill="#d4d4d4"/><text x="66" y="415" fill="#1e3a8a" font-weight="600">WORK EXPERIENCES</text>
    <rect x="64" y="426" width="492" height="96" rx="4" fill="none" stroke="#f97316" stroke-dasharray="4 3"/>
    <text x="190" y="444" text-anchor="end" font-style="italic" fill="#c2410c">{{ x.periodo }}</text>
    <text x="200" y="444" fill="#c2410c" font-weight="700">{{ x.azienda }}</text>
    <text x="200" y="462" fill="#c2410c">{{ x.ruolo }}</text>
    <text x="200" y="480" fill="#c2410c">{{ riga }}  (una per riga)</text>
    <rect x="200" y="488" width="330" height="5" fill="#fed7aa"/><rect x="200" y="498" width="300" height="5" fill="#fed7aa"/>
    <text x="470" y="516" font-size="10" fill="#9a3412">ripetuto</text>

    <rect x="60" y="534" width="500" height="18" fill="#d4d4d4"/><text x="66" y="547" fill="#1e3a8a" font-weight="600">SYNTHESIS OF TECHNICAL SKILLS</text>
    <rect x="64" y="558" width="492" height="66" rx="4" fill="none" stroke="#f97316" stroke-dasharray="4 3"/>
    <text x="190" y="576" text-anchor="end" font-style="italic" fill="#c2410c">{{ s.nome }}</text><text x="200" y="576" fill="#c2410c">{{ s.livello }}</text>
    <text x="190" y="594" text-anchor="end" font-style="italic" fill="#94a3b8">Power BI</text><text x="200" y="594" fill="#94a3b8">Conoscenza base</text>
    <text x="190" y="612" text-anchor="end" font-style="italic" fill="#94a3b8">PostgreSQL</text><text x="200" y="612" fill="#94a3b8">Buona conoscenza</text>
    <text x="470" y="616" font-size="10" fill="#9a3412">ripetuto</text>

    <rect x="60" y="636" width="500" height="18" fill="#d4d4d4"/><text x="66" y="649" fill="#1e3a8a" font-weight="600">LANGUAGES</text>
    <rect x="64" y="660" width="492" height="28" rx="4" fill="none" stroke="#f97316" stroke-dasharray="4 3"/>
    <text x="190" y="678" text-anchor="end" font-style="italic" fill="#c2410c">{{ l.lingua }}</text><text x="200" y="678" fill="#c2410c" font-weight="700">{{ l.livello }}</text>
  </g>
  <!-- footer -->
  <rect x="31" y="800" width="558" height="75" fill="#facc15"/>
  <g font-size="11" fill="#1e293b">
    <text x="70" y="826" font-weight="700">Torino (sede legale)</text><text x="70" y="842">Strada Torino 43 · Orbassano</text>
    <text x="260" y="826" font-weight="700">Milano</text><text x="260" y="842">Via Monti, 8</text>
    <text x="420" y="826" font-weight="700">Roma</text><text x="420" y="842">Via Savoia, 78</text>
  </g>
  <text x="70" y="864" font-size="10" fill="#713f12">intestazione e footer fissi, uguali su ogni pagina</text>

  <!-- side notes -->
  <g font-size="13" fill="#0f172a">
    <text x="620" y="110" font-size="15" font-weight="600">Note sul modello</text>
    <text x="620" y="140">• "Nome" contiene solo il trittico:</text>
    <text x="634" y="158">il CV è anonimizzato.</text>
    <text x="620" y="186">• Email, telefono ed età NON vanno</text>
    <text x="634" y="204">nel CV: finiscono solo nel form</text>
    <text x="634" y="222">e nel record MCFlash.</text>
    <text x="620" y="250">• Azienda attuale spesso "Riservato".</text>
    <text x="620" y="278">• Date esperienze: "Da MM/AAAA</text>
    <text x="634" y="296">a MM/AAAA" oppure "ad Oggi".</text>
    <text x="620" y="324">• Livelli skill nel CV in testo:</text>
    <text x="634" y="342">Conoscenza base · Buona</text>
    <text x="634" y="360">conoscenza · Ottima conoscenza.</text>
    <text x="620" y="388">• Lingue: Base · Intermedio ·</text>
    <text x="634" y="406">Avanzato · Fluente · Madrelingua.</text>
    <text x="620" y="434">• Sezione opzionale TRAINING</text>
    <text x="634" y="452">(corsi, certificazioni) dopo</text>
    <text x="634" y="470">Education, in ~1 CV su 4.</text>
    <text x="620" y="498">• Le sezioni vuote si omettono.</text>
    <text x="620" y="526">• Titoli di sezione in inglese,</text>
    <text x="634" y="544">contenuti in italiano.</text>
  </g>
</svg>
