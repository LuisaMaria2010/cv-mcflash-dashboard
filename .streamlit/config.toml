# Tema della dashboard: colori del modello CV MC (blu #1F3864, testo #2C2C2C).
[theme]
base = "light"
primaryColor = "#1F3864"
backgroundColor = "#F4F7FC"
secondaryBackgroundColor = "#E6EDF8"
textColor = "#2C2C2C"
linkColor = "#2E5AAC"
borderColor = "#D3DCEB"
dataframeBorderColor = "#D3DCEB"
dataframeHeaderBackgroundColor = "#1F3864"
dataframeHeaderTextColor = "#FFFFFF"
blueColor = "#2E5AAC"
greenColor = "#2E8B57"
orangeColor = "#E07B00"
font = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
headingFont = "Barlow:https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap"
headingFontWeights = [700, 600, 600, 600, 600, 600]
baseRadius = "0.6rem"
buttonRadius = "0.6rem"
showWidgetBorder = true

# Barra laterale in blu MC: voci chiare, voce attiva e passaggio del mouse in blu medio.
[theme.sidebar]
backgroundColor = "#1F3864"
secondaryBackgroundColor = "#2E5AAC"
textColor = "#E8EEF9"
primaryColor = "#9DBBF0"
borderColor = "#34508A"
linkColor = "#B9CCEE"

[server]
headless = true
# Nella cartella OneDrive le modifiche ai moduli non sempre arrivano al watcher di
# sistema: con il polling la dashboard ricarica sempre il codice aggiornato.
fileWatcherType = "poll"
# Senza .venv, test e documenti il polling resta veloce: si guarda solo il codice.
folderWatchBlacklist = [".venv", "tests", ".pytest_cache", "docs"]

[browser]
gatherUsageStats = false
