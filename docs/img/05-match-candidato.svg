<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect width="960" height="420" fill="#ffffff"/>
  <text x="30" y="40" font-size="22" font-weight="600" fill="#0f172a">Come si riconosce un candidato esistente</text>
  <text x="30" y="64" font-size="14" fill="#475569">Prima il trittico (codice di 3 lettere del modello MC), poi il nome per distinguere gli omonimi.</text>

  <rect x="30" y="160" width="190" height="70" rx="10" fill="#eef2ff" stroke="#6366f1"/>
  <text x="48" y="190" font-size="14" font-weight="600" fill="#312e81">Dati estratti</text>
  <text x="48" y="212" font-size="12.5" fill="#1e1b4b">codice "DCA" + nome</text>

  <rect x="290" y="160" width="200" height="70" rx="10" fill="#f8fafc" stroke="#64748b"/>
  <text x="306" y="190" font-size="14" font-weight="600" fill="#0f172a">Record MCFlash</text>
  <text x="306" y="212" font-size="12.5" fill="#334155">con lo stesso trittico?</text>
  <path d="M220 195 L286 195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- outcomes -->
  <g font-size="13">
    <path d="M490 180 C 540 120, 560 110, 600 110" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="520" y="118" fill="#475569">0</text>
    <rect x="604" y="86" width="320" height="48" rx="8" fill="#dcfce7" stroke="#16a34a"/>
    <text x="620" y="115" fill="#14532d"><tspan font-weight="600">Nuovo</tspan> → pagina Crea, nuova riga MCFlash</text>

    <path d="M490 195 L600 195" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
    <text x="526" y="188" fill="#475569">1</text>
    <rect x="604" y="160" width="320" height="70" rx="8" fill="#e0f2fe" stroke="#0284c7"/>
    <text x="620" y="186" fill="#0c4a6e"><tspan font-weight="600">Confronta il nome</tspan></text>
    <text x="620" y="206" font-size="12" fill="#0c4a6e">uguale → Aggiorna quella riga</text>
    <text x="620" y="222" font-size="12" fill="#0c4a6e">diverso → omonimo di codice: Crea</text>

    <path d="M490 212 C 540 280, 560 300, 600 300" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="518" y="292" fill="#475569">2+</text>
    <rect x="604" y="262" width="320" height="84" rx="8" fill="#fef3c7" stroke="#d97706"/>
    <text x="620" y="288" fill="#78350f"><tspan font-weight="600">Filtra per nome</tspan></text>
    <text x="620" y="308" font-size="12" fill="#78350f">1 resta → Aggiorna · 0 restano → Crea</text>
    <text x="620" y="326" font-size="12" fill="#78350f">ancora più di 1 → l'utente sceglie dalla lista</text>
    <text x="620" y="340" font-size="12" fill="#78350f">(mostrando ruolo, sede, età)</text>
  </g>

  <text x="30" y="386" font-size="12.5" fill="#475569">Il confronto del nome ignora maiuscole, accenti e spazi. L'utente vede sempre l'esito e può cambiarlo prima di confermare.</text>
</svg>
